<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="65%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="45%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#050810" />
    </radialGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base & Subtle Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="940" cy="315" r="260" fill="#0284c7" opacity="0.16" filter="url(#glow)" />
  <circle cx="860" cy="200" r="180" fill="#9333ea" opacity="0.14" filter="url(#glow)" />
  <circle cx="1020" cy="420" r="190" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Outer Card Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" />

  <!-- LEFT CONTENT -->
  <g transform="translate(84, 115)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="225" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCT PORTFOLIO</text>

    <!-- Name Headline -->
    <text x="0" y="96" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Gulshan Kumar Sahu</text>
    
    <!-- Title / Subtitle -->
    <text x="0" y="148" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
      Product Manager <tspan fill="#38bdf8">|</tspan> AI <tspan fill="#64748b">×</tspan> Data <tspan fill="#64748b">×</tspan> UX <tspan fill="#64748b">×</tspan> Strategy
    </text>

    <!-- Short Description -->
    <text x="0" y="212" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Architecting intelligent enterprise systems, generative AI workflows,</tspan>
      <tspan x="0" dy="28">and user-centered platforms that translate complexity into impact.</tspan>
    </text>

    <!-- 4 Discipline Pills -->
    <g transform="translate(0, 310)">
      <!-- AI / ML -->
      <rect x="0" y="0" width="115" height="36" rx="8" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="57" y="23" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✦ AI &amp; GenAI</text>

      <!-- Data Science -->
      <rect x="127" y="0" width="125" height="36" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="189" y="23" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📊 Data Science</text>

      <!-- UX Design -->
      <rect x="264" y="0" width="115" height="36" rx="8" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <text x="321" y="23" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ UX Design</text>

      <!-- Strategy -->
      <rect x="391" y="0" width="145" height="36" rx="8" fill="rgba(251, 191, 36, 0.12)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" />
      <text x="463" y="23" text-anchor="middle" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🎯 Business Strategy</text>
    </g>

    <!-- Bottom URL Branding -->
    <text x="0" y="405" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="1">
      Interactive Case Studies • Architecture • Systems Thinking
    </text>
  </g>

  <!-- RIGHT GRAPHIC: The Signature 4-Circle Intersection Constellation -->
  <g transform="translate(930, 315)">
    <!-- Outer Orbit Guide Rings -->
    <circle cx="0" cy="0" r="195" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="1" />

    <!-- Overlapping Venn Circles -->
    <!-- Top: AI (Purple) -->
    <circle cx="0" cy="-75" r="82" fill="url(#purpleAccent)" opacity="0.25" />
    <circle cx="0" cy="-75" r="82" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.8" />
    <text x="0" y="-70" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">AI / ML</text>

    <!-- Right: Business (Amber) -->
    <circle cx="75" cy="0" r="82" fill="url(#amberAccent)" opacity="0.22" />
    <circle cx="75" cy="0" r="82" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.8" />
    <text x="80" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">BUSINESS</text>

    <!-- Bottom: UX (Emerald) -->
    <circle cx="0" cy="75" r="82" fill="url(#emeraldAccent)" opacity="0.22" />
    <circle cx="0" cy="75" r="82" fill="none" stroke="#34d399" stroke-width="1.8" opacity="0.8" />
    <text x="0" y="80" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">UX / DESIGN</text>

    <!-- Left: Data (Cyan) -->
    <circle cx="-75" cy="0" r="82" fill="url(#cyanAccent)" opacity="0.25" />
    <circle cx="-75" cy="0" r="82" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.8" />
    <text x="-80" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">DATA</text>

    <!-- Glowing Core Center -->
    <circle cx="0" cy="0" r="32" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
    <circle cx="0" cy="0" r="26" fill="#0b101b" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">PRODUCT</text>
  </g>
</svg>
